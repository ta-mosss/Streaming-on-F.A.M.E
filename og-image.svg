<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF168D"/>
      <stop offset="55%" stop-color="#E5007E"/>
      <stop offset="100%" stop-color="#4A0E7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#E5007E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#4A0E7A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#lines)"/>

  <!-- Logo mark -->
  <g transform="translate(80,90)">
    <circle cx="60" cy="60" r="54" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.45"/>
    <path d="M86 26a44 44 0 1 0 15 33" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.9"/>
    <text x="60" y="80" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="900" font-size="56" fill="url(#g)">S</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(220,140)">
    <text x="0" y="0" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="20" letter-spacing="6" fill="#B3B3B3">STREAMING ON</text>
    <text x="0" y="85" font-family="Montserrat,Arial,sans-serif" font-weight="900" font-size="88" fill="url(#g)" letter-spacing="1">F.A.M.E</text>
    <text x="0" y="118" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#B3B3B3">YOUR STAGE. YOUR STORY.</text>
  </g>

  <!-- Divider -->
  <line x1="80" y1="380" x2="1120" y2="380" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Headline -->
  <text x="80" y="450" font-family="Montserrat,Arial,sans-serif" font-weight="800" font-size="34" fill="#FFFFFF">Africa's home of local entertainment.</text>

  <!-- Meta row -->
  <g transform="translate(80,500)">
    <rect x="0" y="0" width="200" height="42" rx="21" fill="url(#g)"/>
    <text x="100" y="27" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">LAUNCHING 1 JUNE 2027</text>

    <text x="230" y="27" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="16" fill="#B3B3B3">From R29.90 / month</text>
    <text x="470" y="27" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="16" fill="#B3B3B3">·</text>
    <text x="495" y="27" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="16" fill="#B3B3B3">No hidden fees</text>
    <text x="675" y="27" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="16" fill="#B3B3B3">·</text>
    <text x="700" y="27" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="16" fill="#B3B3B3">Cancel anytime</text>
  </g>

  <!-- URL -->
  <text x="1120" y="600" text-anchor="end" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="14" fill="#B3B3B3">www.streamingonfame.co.za</text>
</svg>